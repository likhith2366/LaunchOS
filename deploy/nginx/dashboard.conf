# Serves the operator view and proxies the API, so the dashboard can be opened at
# http://localhost:8090 without the browser hitting cross-origin restrictions on
# every request to a node.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api goes to node 0. Which node serves a read does not matter —
    # they share Postgres and Redis and hold no authoritative state of their own.
    location /api/ {
        proxy_pass http://node0:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # The dashboard polls while a launch is in progress; a slow upstream should
        # show up as a slow panel, not as a dropped request.
        proxy_read_timeout 30s;
    }
}
