# A launch is over in minutes, so the scrape interval is seconds rather than the usual
# fifteen. At 15s a spike that lasts twenty seconds is two data points, which is not
# enough to see a controller react.
global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 5s

scrape_configs:
  - job_name: launchos
    metrics_path: /metrics
    static_configs:
      - targets:
          - node0:8080
          - node1:8080
          - node2:8080
    relabel_configs:
      # Label series by node so per-node behaviour is visible — which matters for the
      # lease-based allocator, where the question is whether work is spread evenly.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: node
        replacement: "$1"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
