# The whole system on one machine: Postgres, Redis, three allocator nodes, Prometheus
# and Grafana.
#
# Three nodes rather than one because the distributed-systems claim is thin with a single
# process that owns all allocation. Three is also as far as it is worth going on 16 GB:
# the point is to show that allocation stays correct across processes, and a fourth node
# demonstrates nothing a third does not.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml run --rm sim all --scale 0.5
#
# Set MULTI_NODE_MODE=leasedShards to run the lease-based allocator instead of letting
# Postgres arbitrate.

name: launchos

x-node-defaults: &node-defaults
  build:
    context: ..
    dockerfile: Dockerfile
  image: launchos:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &node-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: launchos
    POSTGRES_PASSWORD: launchos
    POSTGRES_DB: launchos
    # Per node. Three nodes plus headroom has to fit inside Postgres max_connections,
    # which is why this is modest rather than generous.
    POSTGRES_POOL: "32"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    NODE_COUNT: "3"
    MULTI_NODE_MODE: ${MULTI_NODE_MODE:-postgresArbitrated}
    SWEEP_STRATEGY: ${SWEEP_STRATEGY:-bucketed}
    MAX_PROBES: ${MAX_PROBES:-4}
    LOG_LEVEL: ${LOG_LEVEL:-notice}
    # Accepting a connection is not the same as serving it. The default backlog is the
    # first thing to drop traffic in a spike, and a dropped connection shows up in the
    # results as a client error rather than as the queueing it actually is.
    BACKLOG: "2048"
  deploy:
    resources:
      limits:
        memory: 1g

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchos
      POSTGRES_PASSWORD: launchos
      POSTGRES_DB: launchos
    # Sized for the load the simulator generates: three node pools plus the simulator's
    # own connections, and a shared_buffers that is not the 128 kB default. fsync stays
    # on — the durability claims in this project are only worth making if commits are
    # real, and the cost of that is itself one of the measurements.
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - log_min_duration_statement=2000
      - -c
      - track_io_timing=on
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchos -d launchos"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly bounds the durability gap rather than closing it. LaunchOS never treats
    # Redis as authoritative, so the gap is acceptable by design — queue order lives in
    # Postgres, and killing Redis mid-launch is one of the tests.
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  node0:
    <<: *node-defaults
    environment:
      <<: *node-env
      NODE_ID: node-0
      NODE_INDEX: "0"
      PORT: "8080"
    ports:
      - "8080:8080"

  node1:
    <<: *node-defaults
    environment:
      <<: *node-env
      NODE_ID: node-1
      NODE_INDEX: "1"
      PORT: "8080"
    ports:
      - "8081:8080"

  node2:
    <<: *node-defaults
    environment:
      <<: *node-env
      NODE_ID: node-2
      NODE_INDEX: "2"
      PORT: "8080"
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node0

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # The operator view. Static files, so nginx rather than a Node runtime.
  dashboard:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ../dashboard/dist:/usr/share/nginx/html:ro
      - ./nginx/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node0

  # Not started with the stack: run it when a measurement is wanted.
  #   docker compose -f deploy/docker-compose.yml run --rm sim all --scale 0.5
  sim:
    <<: *node-defaults
    profiles: ["tools"]
    restart: "no"
    ports: []
    entrypoint: ["launch-sim"]
    command:
      - all
      - --node
      - http://node0:8080
      - --node
      - http://node1:8080
      - --node
      - http://node2:8080
      - --output
      - /results
    volumes:
      - ../results:/results
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  pgdata:
  redisdata:
  grafanadata:
